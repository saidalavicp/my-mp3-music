<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barsaat (1999) Music Player</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --bg-color: #1e1e2f;
            --text-color: #ffffff;
            --card-bg: #2d2d44;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; color: var(--primary-color); text-align: center; font-size: 1.8rem; }

        #player-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            margin-bottom: 20px;
        }

        #album-art {
            width: 180px;
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
            border: 4px solid var(--primary-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #song-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        #song-artist { font-size: 0.95rem; color: #b2bec3; margin-bottom: 20px; }

        #progress-container {
            height: 6px;
            background-color: #57606f;
            border-radius: 5px;
            margin-bottom: 8px;
            cursor: pointer;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            border-radius: 5px;
            transition: width 0.1s linear;
        }
        #time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #b2bec3;
            margin-bottom: 15px;
        }

        #controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 20px;
        }

        button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.3rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }
        button:hover { color: var(--primary-color); transform: scale(1.1); }
        #play-pause {
            font-size: 2.2rem;
            background-color: var(--primary-color);
            border-radius: 50%;
            width: 60px; height: 60px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
        }
        #play-pause:hover { background-color: #ff6b81; color: white; }

        #download-btn {
            display: inline-block;
            background-color: #2ed573;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background-color 0.2s;
            box-shadow: 0 4px 10px rgba(46, 213, 115, 0.3);
        }
        #download-btn:hover { background-color: #26af5f; }

        #song-list {
            width: 100%;
            max-width: 380px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 10px;
            list-style: none;
            margin: 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        #song-list li {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
            border-radius: 10px;
        }
        #song-list li:last-child { border-bottom: none; }
        #song-list li:hover { background-color: rgba(255,255,255,0.05); }
        #song-list li.active { background-color: var(--primary-color); color: white; font-weight: bold; }

        .list-thumb {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>Barsaat (1999)</h1>

    <div id="player-container">
        <img id="album-art" src="" alt="Album Art">
        <div id="song-title">Song Title</div>
        <div id="song-artist">Barsaat (1999)</div>

        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="time-info">
            <span id="current-time">0:00</span>
            <span id="total-duration">0:00</span>
        </div>

        <div id="controls">
            <button id="prev"><i class="fas fa-step-backward"></i></button>
            <button id="play-pause"><i class="fas fa-play"></i></button>
            <button id="next"><i class="fas fa-step-forward"></i></button>
        </div>

        <a id="download-btn" href="#" download target="_blank"><i class="fas fa-download"></i> Download Song</a>
    </div>

    <ul id="song-list"></ul>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        const albumArtImg = document.getElementById('album-art');
        const songTitle = document.getElementById('song-title');
        const songArtist = document.getElementById('song-artist');
        const audio = new Audio();
        const playPauseBtn = document.getElementById('play-pause');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeSpan = document.getElementById('current-time');
        const totalDurationSpan = document.getElementById('total-duration');
        const downloadBtn = document.getElementById('download-btn');
        const songListUl = document.getElementById('song-list');

        // എല്ലാ പാട്ടുകൾക്കും ഒരേ 'album.jpg' ഫോട്ടോ തന്നെ നൽകിയിരിക്കുന്നു
        const songs = [
            { title: "Song 1 - Barsaat", src: "song1.mp3", img: "album.jpg" },
            { title: "Song 2 - Barsaat", src: "song2.mp3", img: "album.jpg" },
            { title: "Song 3 - Barsaat", src: "song3.mp3", img: "album.jpg" },
            { title: "Song 4 - Barsaat", src: "song4.mp3", img: "album.jpg" },
            { title: "Song 5 - Barsaat", src: "song5.mp3", img: "album.jpg" },
            { title: "Song 6 - Barsaat", src: "song6.mp3", img: "album.jpg" },
            { title: "Song 7 - Barsaat", src: "song7.mp3", img: "album.jpg" }
        ];

        let songIndex = 0;
        let isPlaying = false;

        function loadSong(song) {
            songTitle.innerText = song.title;
            songArtist.innerText = "Barsaat (1999)";
            audio.src = song.src;
            albumArtImg.src = song.img;
            downloadBtn.href = song.src;
            updateSongListActive();
        }

        function updateSongListActive() {
            const items = songListUl.getElementsByTagName('li');
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
                if (i === songIndex) {
                    items[i].classList.add('active');
                }
            }
        }

        function playSong() {
            isPlaying = true;
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            audio.play().catch(e => console.log("Playback error:", e));
        }

        function pauseSong() {
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            audio.pause();
        }

        playPauseBtn.addEventListener('click', () => {
            isPlaying ? pauseSong() : playSong();
        });

        prevBtn.addEventListener('click', () => {
            songIndex = (songIndex - 1 + songs.length) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        nextBtn.addEventListener('click', () => {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;

                let currentMinutes = Math.floor(currentTime / 60);
                let currentSeconds = Math.floor(currentTime % 60);
                currentTimeSpan.innerText = `${currentMinutes}:${currentSeconds < 10 ? '0' : ''}${currentSeconds}`;

                let durationMinutes = Math.floor(duration / 60);
                let durationSeconds = Math.floor(duration % 60);
                totalDurationSpan.innerText = `${durationMinutes}:${durationSeconds < 10 ? '0' : ''}${durationSeconds}`;
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        audio.addEventListener('ended', () => {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        function initSongList() {
            songs.forEach((song, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <img src="${song.img}" class="list-thumb" alt="Thumbnail">
                    <span>${song.title}</span>
                `;
                li.addEventListener('click', () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                });
                songListUl.appendChild(li);
            });
        }

        loadSong(songs[songIndex]);
        initSongList();
    </script>
</body>
            </html>
