<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ബർസാത്ത് മ്യൂസിക് പ്ലെയർ</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --bg-color: #2f3640;
            --text-color: #f5f6fa;
            --card-bg: #353b48;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 30px; color: var(--primary-color); text-transform: uppercase; }

        #player-container {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            text-align: center;
            margin-bottom: 20px;
        }

        #album-art {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
            border: 5px solid var(--text-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: rotate 20s linear infinite;
            animation-play-state: paused;
        }

        #album-art.playing {
            animation-play-state: running;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #song-title { font-size: 1.4em; font-weight: bold; margin-bottom: 5px; }
        #song-artist { font-size: 1.1em; color: #bdc3c7; margin-bottom: 20px; }

        #controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5em;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }
        button:hover { color: var(--primary-color); transform: scale(1.1); }
        button:active { transform: scale(0.95); }
        #play-pause {
            font-size: 3em;
            background-color: var(--primary-color);
            border-radius: 50%;
            width: 70px; height: 70px;
            display: flex; justify-content: center; align-items: center;
        }
        #play-pause:hover { background-color: #e84118; }

        #progress-container {
            height: 5px;
            background-color: #7f8c8d;
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            border-radius: 5px;
            transition: width 0.1s linear;
        }
        #time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: #bdc3c7;
        }

        #download-btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        #download-btn:hover { background-color: #219150; }

        #song-list {
            width: 90%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 10px;
            list-style: none;
            margin: 0;
        }
        #song-list li {
            padding: 10px;
            border-bottom: 1px solid #7f8c8d;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        #song-list li:last-child { border-bottom: none; }
        #song-list li:hover { background-color: #4a5263; }
        #song-list li.active { background-color: var(--primary-color); color: white; }
        #song-list li span:last-child { font-size: 0.8em; opacity: 0.7; }

    </style>
</head>
<body>

    <h1>ബർസാത്ത് ഗാനങ്ങൾ</h1>

    <div id="player-container">
        <img id="album-art" src="" alt="Album Art"> <!-- ഇവിടെയാണ് ആൽബം ഫോട്ടോ വരുന്നത് -->
        <div id="song-title">പാട്ടിന്റെ പേര്</div>
        <div id="song-artist">Barsaat</div>

        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="time-info">
            <span id="current-time">0:00</span>
            <span id="total-duration">0:00</span>
        </div>

        <div id="controls">
            <button id="prev"><i class="fas fa-step-backward"></i></button>
            <button id="play-pause"><i class="fas fa-play"></i></button>
            <button id="next"><i class="fas fa-step-forward"></i></button>
        </div>

        <a id="download-btn" href="#" download target="_blank"><i class="fas fa-download"></i> പാട്ട് ഡൗൺലോഡ് ചെയ്യുക</a>
    </div>

    <ul id="song-list">
        <!-- പാട്ടുകളുടെ ലിസ്റ്റ് ഇവിടെ JS വഴി വരും -->
    </ul>

    <!-- ഫോണ്ട് ഓസം ഐക്കണുകൾക്കായി -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        const albumArtImg = document.getElementById('album-art');
        const songTitle = document.getElementById('song-title');
        const songArtist = document.getElementById('song-artist');
        const audio = new Audio();
        const playPauseBtn = document.getElementById('play-pause');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeSpan = document.getElementById('current-time');
        const totalDurationSpan = document.getElementById('total-duration');
        const downloadBtn = document.getElementById('download-btn');
        const songListUl = document.getElementById('song-list');

        // --------------------------------------------------------------------------------
        // 7 പാട്ടുകളുടെ വിവരങ്ങൾ ഇവിടെ ചേർക്കുക (മാറ്റം വരുത്തേണ്ട ഭാഗം)
        // --------------------------------------------------------------------------------
        const songs = [
            {
                title: "Barsaat Mein Hum Se Mile", // പാട്ടിന്റെ പേര്
                artist: "Barsaat (1949)",
                src: "YOUR_MP3_LINK_1.mp3", // ഇവിടെ പാട്ടിന്റെ ഓൺലൈൻ ലിങ്ക് നൽകുക
                img: "YOUR_ALBUM_IMAGE_LINK_1.jpg"  // ഇവിടെ ആൽബം ഫോട്ടോയുടെ ലിങ്ക് നൽകുക
            },
            {
                title: "Hawa Mein Udta Jaye",
                artist: "Barsaat (1949)",
                src: "YOUR_MP3_LINK_2.mp3",
                img: "YOUR_ALBUM_IMAGE_LINK_2.jpg"
            },
            {
                title: "Jiya Beqaraar Hai",
                artist: "Barsaat (1949)",
                src: "YOUR_MP3_LINK_3.mp3",
                img: "YOUR_ALBUM_IMAGE_LINK_3.jpg"
            },
            {
                title: "Mujhe Kisi Se Pyaar Ho Gaya",
                artist: "Barsaat (1949)",
                src: "YOUR_MP3_LINK_4.mp3",
                img: "YOUR_ALBUM_IMAGE_LINK_4.jpg"
            },
            {
                title: "Patli Kamar Hai",
                artist: "Barsaat (1949)",
                src: "YOUR_MP3_LINK_5.mp3",
                img: "YOUR_ALBUM_IMAGE_LINK_5.jpg"
            },
            {
                title: "Chhod Gaye Baalam",
                artist: "Barsaat (1949)",
                src: "YOUR_MP3_LINK_6.mp3",
                img: "YOUR_ALBUM_IMAGE_LINK_6.jpg"
            },
            {
                title: "Bichhade Hue Pardesi",
                artist: "Barsaat (1949)",
                src: "YOUR_MP3_LINK_7.mp3",
                img: "YOUR_ALBUM_IMAGE_LINK_7.jpg"
            }
        ];
        // --------------------------------------------------------------------------------
        // (മാറ്റം വരുത്തേണ്ട ഭാഗം ഇവിടെ അവസാനിക്കുന്നു)
        // --------------------------------------------------------------------------------

        let songIndex = 0;
        let isPlaying = false;

        function loadSong(song) {
            songTitle.innerText = song.title;
            songArtist.innerText = song.artist;
            audio.src = song.src;
            albumArtImg.src = song.img;
            downloadBtn.href = song.src; // ഡൗൺലോഡ് ലിങ്ക് സെറ്റ് ചെയ്യുന്നു
            updateSongListActive();
        }

        function updateSongListActive() {
            const items = songListUl.getElementsByTagName('li');
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
                if (i === songIndex) {
                    items[i].classList.add('active');
                }
            }
        }

        function playSong() {
            isPlaying = true;
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            albumArtImg.classList.add('playing');
            audio.play();
        }

        function pauseSong() {
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            albumArtImg.classList.remove('playing');
            audio.pause();
        }

        playPauseBtn.addEventListener('click', () => {
            isPlaying ? pauseSong() : playSong();
        });

        prevBtn.addEventListener('click', () => {
            songIndex = (songIndex - 1 + songs.length) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        nextBtn.addEventListener('click', () => {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;

            let currentMinutes = Math.floor(currentTime / 60);
            let currentSeconds = Math.floor(currentTime % 60);
            currentTimeSpan.innerText = `${currentMinutes}:${currentSeconds < 10 ? '0' : ''}${currentSeconds}`;

            if(duration) {
                let durationMinutes = Math.floor(duration / 60);
                let durationSeconds = Math.floor(duration % 60);
                totalDurationSpan.innerText = `${durationMinutes}:${durationSeconds < 10 ? '0' : ''}${durationSeconds}`;
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        audio.addEventListener('ended', () => {
            songIndex = (songIndex + 1) % songs.length;
            loadSong(songs[songIndex]);
            playSong();
        });

        // പാട്ടുകളുടെ ലിസ്റ്റ് ഉണ്ടാക്കുന്നു
        function initSongList() {
            songs.forEach((song, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${song.title}</span> <span>${song.artist}</span>`;
                li.addEventListener('click', () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                });
                songListUl.appendChild(li);
            });
        }

        // ആദ്യത്തെ പാട്ട് ലോഡ് ചെയ്യുന്നു
        loadSong(songs[songIndex]);
        initSongList();

    </script>

</body>
</html>
